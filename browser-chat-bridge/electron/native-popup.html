<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Chat Native Bridge</title>
  <style>
    body {
      margin: 0;
      padding: 18px;
      color: #e5e7eb;
      background: #0f172a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .card {
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.7);
    }

    .label {
      display: block;
      margin-bottom: 4px;
      color: #94a3b8;
      font-size: 12px;
    }

    .value {
      word-break: break-all;
      font-size: 13px;
    }

    .status {
      display: inline-flex;
      padding: 4px 9px;
      border-radius: 999px;
      background: #334155;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status.ready,
    .status.connected {
      color: #052e16;
      background: #86efac;
    }

    input,
    button {
      box-sizing: border-box;
      width: 100%;
      border-radius: 10px;
      font: inherit;
    }

    input {
      padding: 10px 11px;
      color: #e5e7eb;
      border: 1px solid #334155;
      background: #020617;
    }

    button {
      margin-top: 10px;
      padding: 10px 12px;
      border: 0;
      color: white;
      background: #2563eb;
      cursor: pointer;
      font-weight: 700;
    }

    ul {
      margin: 10px 0 0;
      padding-left: 18px;
    }

    li {
      margin: 6px 0;
    }

    .muted {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <h1>Browser Chat Native Bridge</h1>

  <section class="card">
    <span class="label">Status</span>
    <span id="status" class="status">loading</span>
  </section>

  <section class="card">
    <span class="label">Provider Host</span>
    <div id="ws-url" class="value">—</div>
  </section>

  <section class="card">
    <span class="label">Register Agent</span>
    <input id="agent-id" value="architect" spellcheck="false" autocomplete="off">
    <button id="register-button" type="button">Register Agent</button>
    <p class="muted">Phase 1 registers the native Electron bridge and agent. Chat routing is implemented in Phase 2.</p>
  </section>

  <section class="card">
    <span class="label">Agents</span>
    <ul id="agents"></ul>
  </section>

  <script>
    const statusEl = document.getElementById("status");
    const wsUrlEl = document.getElementById("ws-url");
    const agentsEl = document.getElementById("agents");
    const agentIdEl = document.getElementById("agent-id");
    const registerButton = document.getElementById("register-button");

    function render(status) {
      statusEl.textContent = status.status || "unknown";
      statusEl.className = `status ${status.status || ""}`;
      wsUrlEl.textContent = status.wsUrl || "—";
      agentsEl.innerHTML = "";

      for (const agent of status.agents || []) {
        const item = document.createElement("li");
        item.textContent = `${agent.agentId} — ${agent.status}`;
        agentsEl.appendChild(item);
      }

      if (!status.agents || status.agents.length === 0) {
        const item = document.createElement("li");
        item.textContent = "No agents registered.";
        agentsEl.appendChild(item);
      }
    }

    async function refresh() {
      render(await window.browserChatNative.getStatus());
    }

    registerButton.addEventListener("click", async () => {
      const agentId = agentIdEl.value.trim();
      if (!agentId) return;
      await window.browserChatNative.registerAgent(agentId);
      await refresh();
    });

    window.browserChatNative.onStatus(render);
    refresh();
  </script>
</body>
</html>
